---
layout: default
---
<article>
  <a class="eyebrow" href="/blog/">← Blog</a>
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>
    {% if page.tags.size > 0 %} · {% for tag in page.tags %}<a class="tag" href="/blog/?tag={{ tag | downcase | url_encode }}">{{ tag }}</a>{% endfor %}{% endif %}
  </p>
  {{ content }}
</article>
