<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Same design tokens as index.html */
  :root {
    --forest: #4b6b5a;
    --forest-deep: #263a30;
    --moss: #5f8570;
    --taupe: #d4b483;
    --cream: #f6f2e7;
    --bg: #f6f2e7;
    --fg: #1e2a24;
    --muted: #6d7a71;
    --border: #dcd3bd;
    --card: #fbf8ef;
    --secondary: #ece5d0;
    --font-display: "Libre Baskerville", Georgia, serif;
    --font-sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    --radius: 0.75rem;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--forest); }
  a:hover { color: var(--forest-deep); }
  .top {
    border-bottom: 1px solid var(--border);
    padding: 0 1rem;
  }
  .top-inner {
    max-width: 720px; margin: 0 auto; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--fg); text-decoration: none; }
  .top nav a { margin-left: 1.25rem; font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; }
  .top nav a:hover { color: var(--forest); }
  main { max-width: 720px; margin: 0 auto; padding: 3rem 1rem 4rem; }
  h1, h2, h3 { font-family: var(--font-display); line-height: 1.3; letter-spacing: -0.01em; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0 0 0.5rem; }
  h2 { font-size: 1.4rem; margin: 2.5rem 0 0.75rem; }
  h3 { font-size: 1.15rem; margin: 2rem 0 0.5rem; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .eyebrow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  article p, article li { font-size: 1.05rem; }
  article img { max-width: 100%; height: auto; border-radius: var(--radius); }
  blockquote { margin: 1.5rem 0; padding: 0.25rem 1rem; border-left: 3px solid var(--taupe); color: var(--muted); }
  code { font-size: 0.9em; background: var(--secondary); padding: 0.1em 0.35em; border-radius: 4px; }
  pre { background: var(--forest-deep); color: var(--cream); padding: 1rem; border-radius: var(--radius); overflow-x: auto; line-height: 1.5; }
  pre code { background: none; padding: 0; color: inherit; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
  .post-list { list-style: none; padding: 0; margin: 2rem 0 0; }
  .post-list li { padding: 1.25rem 0; border-bottom: 1px solid var(--border); }
  .post-list a { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--fg); text-decoration: none; }
  .post-list a:hover { color: var(--forest); }
  .post-list p { margin: 0.35rem 0 0; color: var(--muted); }
  .tag { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.55rem; border-radius: 999px; background: var(--secondary); color: var(--forest-deep); margin-right: 0.35rem; }
  footer { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; }
</style>
<!-- Analytics: GoatCounter (cookieless, no consent banner needed) -->
<script data-goatcounter="https://franco-fabian-secchi.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">FFS</a>
    <nav>
      <a href="/blog/">Blog</a>
      <a href="/blog/feed.xml">RSS</a>
      <a href="/">Portfolio</a>
    </nav>
  </div>
</header>
<main>
{{ content }}
</main>
<footer>
  Franco Fabian Secchi · Buenos Aires, Argentina · <a href="/">francosecchi.github.io</a>
</footer>
</body>
</html>
