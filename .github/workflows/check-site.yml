name: Check site

# Builds the site with the same gems GitHub Pages uses and checks the output
# (required files, internal links and anchors, inline JavaScript and JSON-LD).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and check the published site
        run: |
          bundle exec jekyll build
          python3 scripts/check_site.py

      - name: Build and check including drafts
        run: |
          bundle exec jekyll build --drafts --destination _site_drafts
          python3 scripts/check_site.py _site_drafts
